name: CI

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      update_snapshots:
        description: "Regenerate visual-regression snapshots and upload them as an artifact"
        type: boolean
        default: false
      live_smoke:
        description: "Run live-API smoke tests (never on a normal push)"
        type: boolean
        default: false
      before_ref:
        description: "Ref whose tree is captured as the review 'before'"
        type: string
        default: "b780b15c8d32da2f9e2d2a0047ebdd04904b5e61"

permissions:
  contents: read

# The event name is part of the group so a push run and a workflow_dispatch run on the same ref
# (the slow snapshot-regeneration and review-capture dispatch) never cancel each other. Duplicate
# runs of the same event on the same ref (two quick pushes) still cancel the older one.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: web (lint, typecheck, unit, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dashboard-next
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: dashboard-next/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: node ../scripts/check-contract-fence.mjs
      - run: node ../scripts/check-feature-fence.mjs
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  e2e:
    name: e2e (routes + axe, fixture-mocked)
    needs: web
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-noble
    defaults:
      run:
        working-directory: dashboard-next
    env:
      # Explicit (GitHub also sets it): tests/e2e/maps.spec.ts fails, rather than skips, when
      # this image has no WebGL2, so the real-render map checks cannot silently vanish (WR-06).
      CI: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: dashboard-next/package-lock.json
      - run: npm ci
      - run: npx playwright test --project=e2e
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: dashboard-next/playwright-report
          retention-days: 7

  python:
    name: python (pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history: the published-version guard below compares against every
          # earlier revision of contracts/PUBLISHED.json (WR-03).
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements-dev.txt
      - run: pytest
      - run: python scripts/build_contract.py --version 1 --check
      - run: python scripts/check_contract.py --check --additive
      # A commit cannot rewrite or drop a published version together with its own
      # PUBLISHED.json entry: every revision of PUBLISHED.json ever committed must
      # still match the current manifests and artifacts.
      - run: python scripts/check_contract.py --published-history
      - run: python scripts/build_audio_consumers.py --check
      - run: python scripts/build_api_fixtures.py --check
      - run: python scripts/validate_audio_manifest.py

  citations:
    name: citations
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/check-citations.mjs --check-md
      - run: node scripts/check-citations.mjs --scope docs
      - run: node scripts/check-citations.mjs --scope all

  visual:
    name: visual (screenshot regression, Docker-pinned)
    needs: web
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-noble
    defaults:
      run:
        working-directory: dashboard-next
    env:
      PW_VISUAL: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: dashboard-next/package-lock.json
      - run: npm ci
      - if: ${{ github.event_name == 'workflow_dispatch' && inputs.update_snapshots }}
        name: Update snapshots
        env:
          PW_UPDATE: "1"
        run: npx playwright test --project=visual --update-snapshots
      - if: ${{ github.event_name == 'workflow_dispatch' && inputs.update_snapshots }}
        uses: actions/upload-artifact@v4
        with:
          name: visual-snapshots
          path: dashboard-next/tests/e2e/visual.spec.ts-snapshots
      - if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.update_snapshots) }}
        name: Run visual regression
        run: npx playwright test --project=visual
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-visual
          path: dashboard-next/playwright-report
          retention-days: 7

  # Review-only unhidden captures for the owner's before/after page (03-14). Runs only
  # in the snapshot dispatch, next to the visual job's regeneration; never on push.
  # before_ref is consumed only by actions/checkout's `ref:` below. No shell step
  # interpolates an input (T-03-14-01).
  review:
    name: review captures (snapshot dispatch only)
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.update_snapshots }}
    needs: web
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-noble
    defaults:
      run:
        working-directory: dashboard-next
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.before_ref }}
          path: before
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            dashboard-next/package-lock.json
            before/dashboard-next/package-lock.json
      - name: Install head dependencies
        run: npm ci
      - name: Capture head tree (unhidden canvases and maps)
        env:
          REVIEW_OUT: review-captures
        run: npx playwright test -c playwright.review.config.ts
      - name: Copy the review spec and config into the before tree
        if: ${{ !cancelled() }}
        working-directory: .
        run: |
          cp dashboard-next/tests/e2e/review.spec.ts before/dashboard-next/tests/e2e/review.spec.ts
          cp dashboard-next/playwright.review.config.ts before/dashboard-next/playwright.review.config.ts
      - name: Install before-tree dependencies
        if: ${{ !cancelled() }}
        working-directory: before/dashboard-next
        run: npm ci
      - name: Capture before tree (unhidden canvases and maps)
        if: ${{ !cancelled() }}
        working-directory: before/dashboard-next
        env:
          REVIEW_OUT: review-captures
        run: npx playwright test -c playwright.review.config.ts
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: review-captures-after
          path: dashboard-next/review-captures
          retention-days: 14
          if-no-files-found: warn
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: review-captures-before
          path: before/dashboard-next/review-captures
          retention-days: 14
          if-no-files-found: warn

  live-smoke:
    name: live-smoke (manual dispatch only)
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.live_smoke }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - run: python scripts/smoke_live.py
