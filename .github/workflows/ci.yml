name: CI

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      update_snapshots:
        description: "Regenerate visual-regression snapshots and upload them as an artifact"
        type: boolean
        default: false
      live_smoke:
        description: "Run live-API smoke tests (never on a normal push)"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: web (lint, typecheck, unit, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dashboard-next
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: dashboard-next/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  e2e:
    name: e2e (routes + axe, fixture-mocked)
    needs: web
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-noble
    defaults:
      run:
        working-directory: dashboard-next
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: dashboard-next/package-lock.json
      - run: npm ci
      - run: npx playwright test --project=e2e
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: dashboard-next/playwright-report
          retention-days: 7
