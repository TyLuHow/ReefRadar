name: CI

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      update_snapshots:
        description: "Regenerate visual-regression snapshots and upload them as an artifact"
        type: boolean
        default: false
      live_smoke:
        description: "Run live-API smoke tests (never on a normal push)"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: web (lint, typecheck, unit, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dashboard-next
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: dashboard-next/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  e2e:
    name: e2e (routes + axe, fixture-mocked)
    needs: web
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-noble
    defaults:
      run:
        working-directory: dashboard-next
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: dashboard-next/package-lock.json
      - run: npm ci
      - run: npx playwright test --project=e2e
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: dashboard-next/playwright-report
          retention-days: 7

  python:
    name: python (pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements-dev.txt
      - run: pytest

  citations:
    name: citations
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/check-citations.mjs --check-md
      - run: node scripts/check-citations.mjs --scope docs

  visual:
    name: visual (screenshot regression, Docker-pinned)
    needs: web
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-noble
    defaults:
      run:
        working-directory: dashboard-next
    env:
      PW_VISUAL: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: dashboard-next/package-lock.json
      - run: npm ci
      - if: ${{ github.event_name == 'workflow_dispatch' && inputs.update_snapshots }}
        name: Update snapshots
        env:
          PW_UPDATE: "1"
        run: npx playwright test --project=visual --update-snapshots
      - if: ${{ github.event_name == 'workflow_dispatch' && inputs.update_snapshots }}
        uses: actions/upload-artifact@v4
        with:
          name: visual-snapshots
          path: dashboard-next/tests/e2e/visual.spec.ts-snapshots
      - if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.update_snapshots) }}
        name: Run visual regression
        run: npx playwright test --project=visual
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-visual
          path: dashboard-next/playwright-report
          retention-days: 7

  live-smoke:
    name: live-smoke (manual dispatch only)
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.live_smoke }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - run: python scripts/smoke_live.py
